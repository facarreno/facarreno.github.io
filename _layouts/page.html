---
layout: default
---
<div class="page-head">
  <div class="wrap">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p>{{ page.lead }}</p>{% endif %}
  </div>
</div>

<div class="section">
  <div class="wrap">
    {{ content }}
  </div>
</div>

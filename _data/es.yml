home:
  hero_kicker: "Universidad de los Andes · Santiago, Chile"
  hero_title: "El límite no está en la biología, está en el flujo"
  hero_lead: >-
    Lo que me mueve es entender por qué un reactor rinde lo que rinde. Uso
    dinámica de fluidos computacional para abrir esa caja negra —flujo,
    biopelícula, transporte— y convertir lo que aprendo en modelos predictivos
    que sirvan para optimizar y diseñar procesos reales. La misma pregunta la he
    llevado al tratamiento de gases, de aguas y de suelos.
  hero_cta_research: "Ver líneas de investigación"
  hero_cta_cv: "Descargar CV"

  about_title: "Sobre mí"
  about_body: >-
    Soy Doctor en Ciencias de la Ingeniería (*Summa cum laude*) e Ingeniero Civil
    Químico, y actualmente investigador postdoctoral en la Universidad de los
    Andes. Dirijo, como Investigador Responsable, el **Fondecyt de Postdoctorado
    N.º 3250412** (2025–2028), dedicado a caracterizar la dinámica de las
    biopelículas y del azufre elemental en reactores de lecho fijo para la
    desnitrificación autótrofa de aguas subterráneas.


    A lo largo de mi carrera he aplicado estas herramientas a problemas muy
    distintos —biofiltración de gases contaminantes, biorremediación de suelos,
    simulación multifásica de materiales cementicios— y esa multidisciplina es
    la que ha guiado mi trabajo y mis colaboraciones internacionales con la
    Universidad de California, Davis y la Universidad de Valladolid.


    Mi proyección es consolidar una línea propia orientada a construir **gemelos
    digitales** de reactores a partir de simulaciones CFD, y extender más
    adelante estas herramientas al estudio de sistemas acuáticos naturales.


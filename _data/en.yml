home:
  hero_kicker: "Universidad de los Andes · Santiago, Chile"
  hero_title: "Computational simulation to understand and design environmental processes"
  hero_lead: >-
    I use computational fluid dynamics (CFD) and digital imaging to open the
    black box of bioreactors: how gas and liquid flow, how biofilm grows, and
    how that determines the performance of a treatment process.
  hero_cta_research: "Explore research lines"
  hero_cta_cv: "Download CV"

  about_title: "About"
  about_body: >-
    I hold a PhD in Engineering Sciences (*Summa cum laude*) and a degree in
    Chemical Engineering, and I am currently a postdoctoral researcher at
    Universidad de los Andes. I lead, as Principal Investigator, the
    **Fondecyt Postdoctoral Grant No. 3250412** (2025–2028), devoted to
    characterising biofilm and elemental sulfur dynamics in fixed-bed reactors
    for the autotrophic denitrification of groundwater.


    Over my career I have applied these tools to very different problems — gas
    biofiltration, soil bioremediation, multiphase simulation of cementitious
    materials — and that multidisciplinary drive has shaped my work and my
    international collaborations with the University of California, Davis and
    the University of Valladolid.


    My goal is to consolidate an independent line aimed at building **digital
    twins** of reactors from CFD simulations, and later to extend these tools
    to natural aquatic systems.


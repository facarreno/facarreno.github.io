<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {{ site.author.short_name }}{% else %}{{ site.author.name }} · {% if page.lang == 'en' %}{{ site.tagline_en }}{% else %}{{ site.tagline_es }}{% endif %}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
<meta name="author" content="{{ site.author.name }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
{% if page.alt %}<link rel="alternate" hreflang="{% if page.lang == 'es' %}en{% else %}es{% endif %}" href="{{ page.alt | absolute_url }}">{% endif %}
<link rel="alternate" hreflang="{{ page.lang }}" href="{{ page.url | absolute_url }}">

<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title | default: site.author.name }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/img/perfil.jpg' | absolute_url }}">
<meta property="og:locale" content="{% if page.lang == 'en' %}en_US{% else %}es_CL{% endif %}">
<meta name="twitter:card" content="summary">

<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% if page.extra_css %}<link rel="stylesheet" href="{{ page.extra_css | relative_url }}">{% endif %}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.author.name }}",
  "jobTitle": "{{ site.author.role_en }}",
  "affiliation": { "@type": "Organization", "name": "Universidad de los Andes" },
  "email": "mailto:{{ site.author.email }}",
  "url": "{{ site.url }}",
  "identifier": "https://orcid.org/{{ site.author.orcid }}",
  "sameAs": [
    "https://orcid.org/{{ site.author.orcid }}",
    "https://www.linkedin.com/in/{{ site.author.linkedin }}/"
  ]
}
</script>
